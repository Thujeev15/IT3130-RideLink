spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/account_db}
spring.datasource.username=${DB_USERNAME:ci_user}
spring.datasource.password=${DB_PASSWORD:ci_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
