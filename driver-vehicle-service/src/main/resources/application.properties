server.port=${SERVER_PORT:8082}

spring.application.name=driver-vehicle-service

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ridelink_driver?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Shared secret must match the one Account Service (Member 1) signs JWTs with.
# NEVER commit the real value - set this via an environment variable / .env file
# that is excluded via .gitignore.
security.jwt.secret=${JWT_SECRET:change-this-in-your-local-env-file-only}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
