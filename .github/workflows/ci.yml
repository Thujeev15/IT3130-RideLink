name: RideLink Microservices CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  build-and-test:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_USERNAME: ci_user
      DB_PASSWORD: ci_password
      SPRING_DATA_MONGODB_URI: mongodb://127.0.0.1:27017/fare_db
      JWT_SECRET: ci-test-secret-not-for-production

    strategy:
      fail-fast: false
      matrix:
        service:
          - account-service
          - driver-vehicle-service
          - ride-management-service
          - fare-payment-service

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Initialize MySQL test databases
        run: |
          mysql --protocol=TCP -h 127.0.0.1 -uroot -proot <<'SQL'
          CREATE DATABASE IF NOT EXISTS account_db;
          CREATE DATABASE IF NOT EXISTS ridelink_driver;
          CREATE DATABASE IF NOT EXISTS ridelink;
          CREATE USER IF NOT EXISTS 'ci_user'@'%' IDENTIFIED BY 'ci_password';
          GRANT ALL PRIVILEGES ON account_db.* TO 'ci_user'@'%';
          GRANT ALL PRIVILEGES ON ridelink_driver.* TO 'ci_user'@'%';
          GRANT ALL PRIVILEGES ON ridelink.* TO 'ci_user'@'%';
          FLUSH PRIVILEGES;
          SQL

      - name: Compile and Test ${{ matrix.service }}
        working-directory: ${{ matrix.service }}
        run: mvn --batch-mode clean test

      - name: Upload Surefire Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: warn