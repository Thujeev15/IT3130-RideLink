spring.application.name=ride-management-service

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/ridelink
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

security.jwt.secret=${JWT_SECRET}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

driver.service.base-url=${DRIVER_SERVICE_BASE_URL:http://localhost:8082}
fare-payment.service.base-url=${FARE_PAYMENT_SERVICE_BASE_URL:http://localhost:8083}

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html